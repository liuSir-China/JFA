# JFA local configuration. Defaults keep all diagnostic data on this machine.
#
# JFA's own workspace for product-managed artifacts and the service registry.
# This is NOT the application's HeapDumpPath. Live --pid diagnose should prefer
# paths parsed from the target JVM (HeapDumpPath / -Xloggc and related flags).
# Do not point evidence.root at the application dump directory just to diagnose.
evidence.root=${user.home}/.jfa/evidence
#
# Retention window in days. Deletes ONLY JFA-managed evidence under the JFA
# workspace, reportfile output, and registered lifecycle directories.
# Does NOT delete the application's own dump or GC files outside JFA management.
retention.days=7
#
# Disk guard: refuse large writes (heap dump) when usable bytes fall below this.
min.free.bytes=1073741824
#
# Disk guard: refuse large writes when usable space / total space is below this ratio.
min.free.ratio=0.05
#
# When true: if reportfile/pid_<pid>/ already exists, delete that pid folder's
# previous reports/evidence before writing this run.
# When false: keep old timestamp directories; create a new pid_<pid>/<timestamp>/.
cover.file=true
#
# Diagnose/analyze output root. Default when unset: <JFA install home>/reportfile
# (install home = directory that contains bin/ and conf/, from launcher or jar).
# Uncomment to override. Live --pid runs still prefer JVM HeapDumpPath / GC paths
# for existing evidence; this directory holds JFA-produced reports and collects.
# reportfile.root=
#
# When false, JFA does not upload dumps or reports. Keep false for intranet use.
outbound.enabled=false
