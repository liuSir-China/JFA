# JFA local configuration. Defaults keep all diagnostic data on this machine.
#
# Diagnose/analyze output root. Default when unset: <JFA install home>/reportfile
# (install home = directory that contains bin/ and conf/, from launcher or jar).
# Live --pid runs still prefer JVM HeapDumpPath / GC paths for existing evidence,
# then copy or hardlink them into this run directory so each run folder is self-contained.
# Uncomment to override.
# reportfile.root=
#
# Retention window in days. Deletes ONLY JFA-managed reportfile run directories
# (product output under reportfile/pid_*/<timestamp>/).
# Does NOT delete the application's own dump or GC files outside JFA management.
retention.days=7
#
# Disk guard: refuse large writes (heap dump) when usable bytes fall below this.
min.free.bytes=1073741824
#
# Disk guard: refuse large writes when usable space / total space is below this ratio.
min.free.ratio=0.05
#
# When true: if reportfile/pid_<pid>/ already exists, delete that pid folder's
# previous reports/evidence before writing this run.
# When false: keep old timestamp directories; create a new pid_<pid>/<timestamp>/.
cover.file=true
#
# Live --pid memory/auto diagnose: jstat -gcutil sampling interval in seconds.
sample.interval.seconds=5
#
# Live --pid memory/auto diagnose: number of jstat -gcutil samples (typical 6-12).
sample.count=8
#
# App-log lookback window in minutes, counted back from analysis time.
log.lookback.minutes=10
#
# Dual-hprof class histogram compare: top N classes in the compare table.
compare.top.n=20
